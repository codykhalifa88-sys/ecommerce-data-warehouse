name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ecommerce_dw
          POSTGRES_USER: dw_user
          POSTGRES_PASSWORD: change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dw_user -d ecommerce_dw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: ecommerce_dw
      POSTGRES_USER: dw_user
      POSTGRES_PASSWORD: change_me
      RAW_DATA_DIR: data/raw

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.1/constraints-3.11.txt"

      - name: Apply schema DDL
        run: |
          psql "postgresql://dw_user:change_me@localhost:5432/ecommerce_dw" -f sql/ddl/01_staging_schema.sql
          psql "postgresql://dw_user:change_me@localhost:5432/ecommerce_dw" -f sql/ddl/02_warehouse_schema.sql
        env:
          PGPASSWORD: change_me

      - name: Generate sample data
        run: python scripts/generate_sample_data.py

      - name: Run pipeline (extract -> clean -> load)
        run: |
          python -m etl.extract
          python -m etl.clean
          python -m etl.load

      - name: Run unit tests (no DB required)
        run: pytest tests/test_transforms.py -v

      - name: Run data quality checks
        run: pytest tests/test_data_quality.py -v
